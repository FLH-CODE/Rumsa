<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- INTE maximum-scale=1.0/user-scalable=no – på Android, i kombination med vissa
         OS-inställningar för förstoring/tillgänglighet (t.ex. "Förstoring" i Android), gör det att
         Chrome kräver en TVÅFINGERS-gest för att panorera istället för en vanlig
         enfingers-scroll, eftersom webbläsaren annars tappar den enfingers-gest den annars hade
         gett till just den tillgänglighetsfunktionen. touch-action: manipulation (se index.css)
         sköter redan att dubbeltryck-zoom är avstängt, utan den bieffekten. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#164e63" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rumsa" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Rumsa – rumsinventering</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

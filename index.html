<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Testat att ta bort maximum-scale/user-scalable – gav NOLL skillnad för
         enfingers-scroll-buggen på Android Chrome (den teorin visade sig fel), men gjorde att
         pinch-zoom blev möjligt i vanligt (icke-helskärms-)läge i Android-telefonens
         standardwebbläsare, vilket inte önskas. Tillbaka till båda – touch-action: pan-x pan-y
         (se index.css) är inte ensamt tillräckligt för att stänga av zoom i alla webbläsare. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#164e63" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rumsa" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Rumsa – rumsinventering</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
